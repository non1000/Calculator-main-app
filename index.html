<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="./assets/images/favicon-32x32.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&display=swap" rel="stylesheet">
    <title>Calculator app main</title>
</head>
<body>
    <div class="main-body">
        <div class="top-area space-btw">
            <h2>calc</h2>
            <div class="theme-toggle space-btw">
                <p>THEME</p>
                <p>T</p>
            </div>
        </div>
        <div class="output">
            <h1>399,981</h1>
        </div>
        <div class="number-display">
            <div class="numbers">
                <button class="backgroundcolor1">7</button>
                <button class="backgroundcolor1">8</button>
                <button class="backgroundcolor1">9</button>
                <button class="backgroundcolor2">DEL</button>
                <button class="backgroundcolor1">4</button>
                <button class="backgroundcolor1">5</button>
                <button class="backgroundcolor1">6</button>
                <button class="backgroundcolor1">+</button>
                <button class="backgroundcolor1">1</button>
                <button class="backgroundcolor1">2</button>
                <button class="backgroundcolor1">3</button>
                <button class="backgroundcolor1">-</button>
                <button class="backgroundcolor1">.</button>
                <button class="backgroundcolor1">0</button>
                <button class="backgroundcolor1">/</button>
                <button class="backgroundcolor1">×</button>
            </div>
            <div class="reset">
                <button class="backgroundcolor2">RESET</button>
                <button class="backgroundcolor3">=</button>
            </div>
        </div>
    </div>
</body>
</html>
